<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Über mich – Levin Nigg</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #003b8b;
      --secondary: #2a66c2;
      --bg: #f9fafb;
      --light: #ffffff;
      --dark: #1f1f1f;
      --shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--dark);
      padding: 40px 20px;
      text-align: center;
    }
    nav {
      margin-bottom: 20px;
    }
    nav a {
      margin: 0 15px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      position: relative;
      padding: 4px;
    }
    nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 3px;
      background: var(--secondary);
    }
    nav a:hover {
      color: var(--secondary);
    }
    h1 {
      color: var(--primary);
      margin-bottom: 30px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: auto;
    }
    .gallery img {
      width: 100%;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Startseite</a>
  <a href="seite2.html" class="active">Über mich</a>
  <a href="seite3.html">Meine Stärken</a>
</nav>

<h1>Über mich</h1>
<div class="gallery">
  <img src="foto1.jpg" alt="Foto 1">
  <img src="foto2.jpg" alt="Foto 2">
  <img src="foto3.jpg" alt="Foto 3">
</div>

</body>
</html>
