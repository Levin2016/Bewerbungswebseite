<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Über mich – Levin Nigg</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <style>
    :root {
      --primary: #1d4ed8;
      --bg: #f9fafb;
      --dark: #1f2937;
      --light: #ffffff;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--dark);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      color: var(--primary);
      margin: 0 auto 10px auto;
      padding-bottom: 5px;
      border-bottom: 2px solid var(--primary);
      width: fit-content;
      text-align: center;
    }

    nav {
      text-align: center;
      margin-bottom: 30px;
    }

    nav a {
      color: var(--primary);
      margin: 0 15px;
      text-decoration: none;
      font-weight: 600;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .item {
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .item:hover {
      transform: scale(1.03);
    }

    .item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      opacity: 0.9;
    }

    .item p {
      margin: 0;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      text-align: center;
      font-weight: 600;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .overlay-inner {
      max-width: 90%;
      background: white;
      border-radius: 12px;
      padding: 20px;
      color: black;
      text-align: center;
      position: relative;
    }

    .overlay img,
    .overlay video {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .overlay .close {
      position: absolute;
      top: 10px;
      right: 20px;
      color: black;
      font-size: 30px;
      cursor: pointer;
    }

    .form {
      max-width: 500px;
      margin: 40px auto;
    }

    .form input,
    .form textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .form button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 40px;
      text-decoration: none;
      color: var(--primary);
      font-weight: 600;
    }

    #successMessage {
      display: none;
      background: #d1fae5;
      color: #065f46;
      border: 2px solid #10b981;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Startseite</a>
  <a href="seite2.html"><strong>Über mich</strong></a>
  <a href="seite3.html">Stärken</a>
</nav>

<!-- Overlay -->
<div id="overlay" class="overlay" onclick="closeOverlay()">
  <div class="overlay-inner" onclick="event.stopPropagation()">
    <span class="close" onclick="closeOverlay()">×</span>
    <img id="overlayImg" src="" alt="" style="display:none;">
    <video id="overlayVideo" controls style="display:none;"></video>
    <p id="overlayText"></p>
  </div>
</div>

<!-- Kontaktformular -->
<div class="form" data-aos="fade-up" data-aos-delay="400">
  <h2 style="text-align:center;">📬 Fragen an mich?</h2>
  <div id="successMessage">✅ Ihre Nachricht wurde versendet!</div>

  <form id="kontaktForm">
    <input type="text" name="name" placeholder="Name" required />
    <input type="email" name="email" placeholder="Email" required />
    <textarea name="message" placeholder="Nachricht" required></textarea>
    <button type="submit">Nachricht senden</button>
  </form>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init({
    duration: 800,
    once: true
  });

  function openOverlay(imageSrc, text) {
    document.getElementById("overlayImg").style.display = "block";
    document.getElementById("overlayVideo").style.display = "none";
    document.getElementById("overlayImg").src = imageSrc;
    document.getElementById("overlayText").textContent = text;
    document.getElementById("overlay").style.display = "flex";
  }

  function openOverlayVideo(videoSrc, text) {
    document.getElementById("overlayImg").style.display = "none";
    const video = document.getElementById("overlayVideo");
    video.src = videoSrc;
    video.style.display = "block";
    document.getElementById("overlayText").textContent = text;
    document.getElementById("overlay").style.display = "flex";
  }

  function closeOverlay() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("overlayVideo").pause();
  }

  // Formular per JavaScript senden (AJAX)
  const form = document.getElementById('kontaktForm');
  const successMessage = document.getElementById('successMessage');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    const formData = new FormData(form);

    fetch('https://formspree.io/f/mwpojakl', {
      method: 'POST',
      body: formData,
      headers: {
        'Accept': 'application/json'
      }
    }).then(response => {
      if (response.ok) {
        successMessage.style.display = 'block';
        form.reset();
        setTimeout(() => {
          successMessage.style.display = 'none';
        }, 7000);
      } else {
        alert("❌ Fehler beim Senden. Bitte erneut versuchen.");
      }
    }).catch(error => {
      alert("❌ Netzwerkfehler. Bitte später erneut versuchen.");
    });
  });
</script>

</body>
</html>
