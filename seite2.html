<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Über mich – Levin Nigg</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #1d4ed8;
      --bg: #f9fafb;
      --dark: #1f2937;
      --light: #ffffff;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--dark);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 10px;
      border-bottom: 2px solid var(--primary);
      display: inline-block;
      padding-bottom: 5px;
    }

    nav {
      text-align: center;
      margin-bottom: 30px;
    }

    nav a {
      color: var(--primary);
      margin: 0 15px;
      text-decoration: none;
      font-weight: 600;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .item {
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .item:hover {
      transform: scale(1.03);
    }

    .item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      opacity: 0.9;
    }

    .item p {
      margin: 0;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      text-align: center;
      font-weight: 600;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .overlay-inner {
      max-width: 90%;
      background: white;
      border-radius: 12px;
      padding: 20px;
      color: black;
      text-align: center;
    }

    .overlay img,
    .overlay video {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .overlay .close {
      position: absolute;
      top: 10px;
      right: 20px;
      color: white;
      font-size: 30px;
      cursor: pointer;
    }

    .form {
      max-width: 500px;
      margin: 40px auto;
    }

    .form input,
    .form textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .form button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 40px;
      text-decoration: none;
      color: var(--primary);
      font-weight: 600;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Startseite</a>
  <a href="seite2.html"><strong>Über mich</strong></a>
  <a href="seite3.html">Stärken</a>
</nav>

<h1>Über mich</h1>
<p style="text-align:center;">Was mich ausmacht – meine Interessen & Ziele:</p>

<div class="container">
  <div class="item" onclick="openOverlay('images/Grizzlys.png', 'Ich spiele Unihockey bei den Grizzlys und bin seit einem Jahr auch Trainer.')">
    <img src="images/Sporthobbys.png" alt="Sporthobbys" />
    <p>🏑 Sport & Ehrenamt</p>
  </div>
  <div class="item" onclick="openOverlay('images/Freizeit.png', 'In meiner Freizeit drehe und schneide ich gerne Filme.')">
    <img src="images/Freizeit.png" alt="Freizeit" />
    <p>🎬 Freizeit & Projekte</p>
  </div>
  <div class="item" onclick="openOverlay('images/Mediamatiker.png', 'Mediamatik ist die perfekte Verbindung aus Technik & Kreativität.')">
    <img src="images/u3.png" alt="Warum Mediamatik" />
    <p>💻 Warum Mediamatik?</p>
  </div>
  <div class="item" onclick="openOverlayVideo('video/was_macht_mich_aus.mp4', 'Was macht mich aus?')">
    <img src="images/levin_bild.png" alt="Video" />
    <p>🎥 Persönliches Video</p>
  </div>
</div>

<!-- Overlay -->
<div id="overlay" class="overlay" onclick="closeOverlay()">
  <div class="overlay-inner" onclick="event.stopPropagation()">
    <span class="close" onclick="closeOverlay()">×</span>
    <img id="overlayImg" src="" alt="" style="display:none;">
    <video id="overlayVideo" controls style="display:none;"></video>
    <p id="overlayText"></p>
  </div>
</div>

<!-- Kontaktformular -->
<div class="form">
  <h2 style="text-align:center;">📬 Fragen an mich?</h2>
  <form action="https://formspree.io/f/mwpojakl" method="POST">
    <input type="text" name="name" placeholder="Name" required />
    <input type="email" name="email" placeholder="Email" required />
    <textarea name="message" placeholder="Nachricht" required></textarea>
    <button type="submit">Nachricht senden</button>
  </form>
</div>

<a href="index.html" class="back-link">← Zurück zur Startseite</a>

<script>
  function openOverlay(imageSrc, text) {
    document.getElementById("overlayImg").style.display = "block";
    document.getElementById("overlayVideo").style.display = "none";
    document.getElementById("overlayImg").src = imageSrc;
    document.getElementById("overlayText").textContent = text;
    document.getElementById("overlay").style.display = "flex";
  }

  function openOverlayVideo(videoSrc, text) {
    document.getElementById("overlayImg").style.display = "none";
    const video = document.getElementById("overlayVideo");
    video.src = videoSrc;
    video.style.display = "block";
    document.getElementById("overlayText").textContent = text;
    document.getElementById("overlay").style.display = "flex";
  }

  function closeOverlay() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("overlayVideo").pause();
  }
</script>

</body>
</html>
