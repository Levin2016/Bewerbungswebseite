<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Levin Nigg – Startseite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #003b8b;
      --secondary: #2a66c2;
      --bg: #f9fafb;
      --light: #ffffff;
      --dark: #1f1f1f;
      --shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--dark);
      padding: 40px 20px;
      text-align: center;
    }
    nav {
      margin-bottom: 20px;
    }
    nav a {
      margin: 0 15px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      position: relative;
      padding: 4px;
    }
    nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 3px;
      background: var(--secondary);
    }
    nav a:hover {
      color: var(--secondary);
    }
    h1 {
      color: var(--primary);
      margin-bottom: 30px;
    }
    img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    p {
      font-size: 1.1rem;
      margin-top: 20px;
      color: #374151;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="active">Startseite</a>
  <a href="seite2.html">Über mich</a>
  <a href="seite3.html">Meine Stärken</a>
</nav>

<img src="levin_bild.png" alt="Levin Nigg">

</body>
</html>
